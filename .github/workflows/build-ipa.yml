name: Build IPA
on:
  workflow_dispatch:
    inputs:
      native_tests:
        description: 运行原生和模拟器界面测试（首次启动较慢）
        type: boolean
        default: false
  workflow_call:
    inputs:
      native_tests:
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Portable regression tests
        run: |
          swiftc -parse-as-library PyLearn/Store.swift PyLearn/Projects.swift tests/StorageRegression.swift -o /tmp/pylearn-storage-tests
          /tmp/pylearn-storage-tests
          python3 scripts/prepare_python_packages.py
          python3 -m unittest discover -s tests -v
      - name: Build and verify IPA
        run: bash scripts/build_ipa.sh
      - name: Native tests on iPhone simulator
        if: github.event_name == 'push' || inputs.native_tests
        timeout-minutes: 25
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          python3 tests/model_test_server.py > .build/model-test-server.log 2>&1 &
          MODEL_SERVER_PID=$!
          trap 'kill "$MODEL_SERVER_PID" 2>/dev/null || true' EXIT
          set -o pipefail
          xcodebuild -project PyLearn.xcodeproj -scheme PyLearn -configuration Debug -destination "id=$SIMULATOR" -destination-timeout 90 -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 -derivedDataPath .build/simulator -resultBundlePath .build/NativeTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES test 2>&1 | tee .build/native-tests.log || { tail -100 .build/native-tests.log; exit 1; }
          xcrun xcresulttool get test-results summary --path .build/NativeTests.xcresult > dist/native-test-summary.json
          xcrun xcresulttool export attachments --path .build/NativeTests.xcresult --output-path dist/screenshots
      - name: Upload IPA and verification
        uses: actions/upload-artifact@v4
        with:
          name: PyLearn-iOS16.3-TrollStore
          path: dist/
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          include-hidden-files: true
          path: |
            .build/*-build.log
            .build/native-tests.log
            .build/model-test-server.log
          retention-days: 7
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          include-hidden-files: true
          path: |
            .build/NativeTests.xcresult
            !.build/NativeTests.xcresult/Staging/**
          retention-days: 7
