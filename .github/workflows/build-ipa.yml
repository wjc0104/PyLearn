name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Portable regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify IPA
        run: bash scripts/build_ipa.sh
      - name: Native tests on iPhone simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcodebuild -project PyLearn.xcodeproj -scheme PyLearn -configuration Debug -destination "id=$SIMULATOR" -derivedDataPath .build/simulator -resultBundlePath .build/NativeTests.xcresult CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test > .build/native-tests.log 2>&1 || { tail -120 .build/native-tests.log; exit 1; }
          xcrun xcresulttool export attachments --path .build/NativeTests.xcresult --output-path dist/screenshots
      - name: Upload IPA and verification
        uses: actions/upload-artifact@v4
        with:
          name: PyLearn-iOS16.3-TrollStore
          path: dist/
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            .build/*-build.log
            .build/native-tests.log
            .build/NativeTests.xcresult
          retention-days: 7
