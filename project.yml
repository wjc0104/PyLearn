name: PyLearn
options:
  bundleIdPrefix: com.wjc0104
  deploymentTarget:
    iOS: "16.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.3"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    GENERATE_INFOPLIST_FILE: YES
packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    exactVersion: 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    revision: 15cf3a9ec3ab95e0d058b7df9f35619123c9e02d
targets:
  PyLearn:
    type: application
    platform: iOS
    info:
      path: .build/PyLearn-Info.plist
      properties:
        NSLocalNetworkUsageDescription: 连接你配置的局域网 AI 服务。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    sources:
      - path: PyLearn
        excludes: [Resources]
      - path: PyLearn/Resources
        buildPhase: resources
        excludes: ["**/__pycache__", "**/*.pyc"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjc0104.pylearn
        SWIFT_OBJC_BRIDGING_HEADER: PyLearn/Runtime/BridgingHeader.h
        HEADER_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Python 学习"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - framework: Vendor/Python.xcframework
        embed: true
    postBuildScripts:
      - name: Embed CPython standard library
        script: 'bash "$PROJECT_DIR/scripts/embed_python.sh"'
        basedOnDependencyAnalysis: false
  PyLearnTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PyLearnTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjc0104.pylearn.tests
        SWIFT_OBJC_BRIDGING_HEADER: PyLearn/Runtime/BridgingHeader.h
    dependencies:
      - target: PyLearn
  PyLearnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PyLearnUITests]
    dependencies:
      - target: PyLearn
schemes:
  PyLearn:
    build:
      targets:
        PyLearn: all
    test:
      targets:
        - PyLearnTests
        - PyLearnUITests
      gatherCoverageData: false
